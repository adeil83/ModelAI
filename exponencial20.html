<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAIA - Modelagem da Bola Saltitante</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-blue: #1a73e8;
            --vid-red: #d93025;
            --bg-light: #f8f9fa;
        }

        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-light); }

        .header-blue {
            background-color: var(--primary-blue);
            color: white;
            padding: 20px 40px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border-bottom: 5px solid #1557b0;
        }

        .header-blue h1 { margin: 0; font-size: 2rem; }
        .header-blue p { margin: 5px 0 0; font-size: 1rem; opacity: 0.9; }

        .main-container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 20px;
            display: grid;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #e0e0e0;
        }

        .controls {
            display: flex;
            gap: 30px;
            align-items: center;
            justify-content: center;
            background: #f1f3f4;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .slider-group { display: flex; flex-direction: column; align-items: center; flex: 1; }
        input[type=range] { width: 100%; max-width: 300px; cursor: pointer; accent-color: var(--primary-blue); }
        label { margin-bottom: 8px; font-weight: bold; color: #333; }

        .formula-box {
            text-align: center;
            font-family: 'Times New Roman', serif;
            font-size: 2.5rem;
            color: #222;
            margin-top: 15px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        canvas { width: 100% !important; height: 480px !important; }
    </style>
</head>
<body>

<header class="header-blue">
    <h1>Laboratório MAIA</h1>
    <p>Professor Adeil Araújo | Modelagem da Função Exponencial</p>
</header>

<div class="main-container">
    <div class="card">
        <div class="controls">
            <div class="slider-group">
                <label>Altura Inicial (h₀): <span id="valH">0.00</span> m</label>
                <input type="range" id="sliderH" min="0.0" max="2.0" step="0.01" value="0.00">
            </div>
            <div class="slider-group" style="border-left: 2px solid #ccc; padding-left: 30px;">
                <label>Coef. Restituição (e): <span id="valE">0.50</span></label>
                <input type="range" id="sliderE" min="0.30" max="0.95" step="0.01" value="0.50">
            </div>
        </div>

        <canvas id="bounceChart"></canvas>

        <div class="formula-box" id="formula">
            h<sub>n</sub> = 0.00 · (0.50)<sup>2n</sup>
        </div>
    </div>
</div>

<script>
    const ctx = document.getElementById('bounceChart').getContext('2d');
    let chart;

    const g = 9.81;
    const h0_ref = 1.33;
    const e_ref = 0.77;

    // Gera os pontos da videoanálise (fixos)
    function generateExperimentalData() {
        const points = [];
        let h = h0_ref;
        let t_off = 0;
        for (let n = 0; n < 8; n++) {
            let v = Math.sqrt(2 * g * h);
            let t_f = (2 * v) / g;
            if (n === 0) {
                for (let t = 0; t <= t_f/2; t += 0.04) points.push({x: t, y: h - 0.5 * g * t * t});
                t_off = t_f / 2;
            } else {
                for (let t = 0; t <= t_f; t += 0.04) points.push({x: t_off + t, y: v * t - 0.5 * g * t * t});
                t_off += t_f;
            }
            h *= (e_ref * e_ref);
        }
        return points;
    }
    const expPoints = generateExperimentalData();

    function update() {
        const h0 = parseFloat(document.getElementById('sliderH').value);
        const e = parseFloat(document.getElementById('sliderE').value);

        document.getElementById('valH').innerText = h0.toFixed(2);
        document.getElementById('valE').innerText = e.toFixed(2);
        document.getElementById('formula').innerHTML = `h<sub>n</sub> = ${h0.toFixed(2)} · (${e.toFixed(2)})<sup>2n</sup>`;

        const curvePoints = [];
        let t_env = 0;

        for (let n = 0; n < 7; n++) {
            let h_mod = h0 * Math.pow(e, 2 * n);
            let v_mod = Math.sqrt(2 * g * h_mod);
            let t_peak = (n === 0) ? 0 : (2 * v_mod / g);
            t_env += t_peak;
            curvePoints.push({x: t_env, y: h_mod});
        }

        if (chart) {
            chart.data.datasets[1].data = curvePoints;
            chart.update('none');
        } else {
            chart = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [
                        { label: 'VidAnalysis', data: expPoints, backgroundColor: 'rgba(26, 115, 232, 0.4)', pointRadius: 3 },
                        { label: 'Envelope', data: curvePoints, borderColor: '#d93025', borderWidth: 3, borderDash: [6, 4], showLine: true, pointRadius: 0, fill: false, tension: 0.3 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { type: 'linear', min: 0, max: 4.0, title: { display: true, text: 'Tempo (s)' } },
                        y: { min: 0, max: 2.0, title: { display: true, text: 'Altura (m)' } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }
    }

    document.querySelectorAll('input').forEach(s => s.addEventListener('input', update));
    update();
</script>
</body>
</html>
